name: Run Tests

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # EXLA on the CPU is a real Linux deployment, so this job runs all tests.
  exla:
    name: Tests / exla
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # mix test starts the emlx application in this job too, and EMLX on Linux needs
      # OpenBLAS. apt-get can block on the dpkg lock without a timeout, so each call is
      # bounded and retried once.
      - name: Install OpenBLAS (for emlx)
        timeout-minutes: 6
        run: |
          if ldconfig -p | grep -q libopenblas.so.0; then
            echo "libopenblas already present, nothing to install"
            exit 0
          fi

          for attempt in 1 2; do
            if [ "$attempt" -gt 1 ]; then
              sleep 10
            fi

            status=0
            timeout 60 sudo apt-get update &&
              timeout 90 sudo apt-get install -y --no-install-recommends libopenblas0 ||
              status=$?

            if [ "$status" -eq 0 ]; then
              exit 0
            fi

            if [ "$status" -eq 124 ]; then
              echo "::warning::apt attempt $attempt stalled and was killed"
            else
              echo "::warning::apt attempt $attempt failed with status $status"
            fi
          done

          echo "::error::could not install libopenblas0. A stall is usually the Ubuntu mirror; the apt output above says which."
          exit 1
      - name: Set up Elixir
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          otp-version: "29"
          elixir-version: "1.20"
      # ~/.cache/xla keeps the XLA archive and the compiled EXLA NIF.
      - name: Restore dependencies cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            deps
            _build
            ~/.cache/xla
          key: ${{ runner.os }}-mix-otp29-elixir1.20-${{ hashFiles('**/mix.lock') }}
      # The tests download ONNX models from the Hugging Face Hub. Each job restores the
      # newest model cache of its OS, and saves it on main only when the set of cached files
      # changed, because a save uploads the whole cache. Change v2 to start a cache without
      # the models that the tests no longer use.
      - name: Restore model cache
        id: models
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/transmuter
          key: ${{ runner.os }}-transmuter-models-v2-
          restore-keys: ${{ runner.os }}-transmuter-models-v2-
      - name: Install dependencies
        run: mix deps.get
      # Elixir and OTP are pinned in this job only, so the version-dependent checks run here.
      - name: Check formatting
        run: mix format --check-formatted
      - name: Compile without warnings
        env:
          MIX_ENV: test
        run: mix compile --force --warnings-as-errors
      - name: Run Credo
        run: mix credo --strict
      # Tests tagged large_model are too large or too slow for a runner, for example models
      # with billions of parameters. They run locally. Two tests at a time take 30% less
      # time than one, with a peak of about 7 GB on a runner that has 16 GB.
      - name: Run tests
        env:
          TRANSMUTER_TEST_BACKEND: exla
        run: mix test --exclude large_model --max-cases 2
      - name: List the cached models
        id: model-files
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: &list-models |
          cd ~/.cache/transmuter
          hash=$(find . -type f ! -name '*.part' | sort | shasum -a 256 | cut -c1-16)
          echo "hash=$hash" >> "$GITHUB_OUTPUT"
          echo "Model cache: $(du -sh . | cut -f1), file list hash $hash"
      - name: Save model cache
        if: steps.model-files.outputs.hash != '' && steps.models.outputs.cache-matched-key != format('{0}-transmuter-models-v2-{1}', runner.os, steps.model-files.outputs.hash)
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/transmuter
          key: ${{ runner.os }}-transmuter-models-v2-${{ steps.model-files.outputs.hash }}

  # EMLX on the Metal GPU of an Apple silicon runner, the configuration that EMLX users have.
  # The full EMLX suite runs on Apple silicon before a push. Here, EMLX runs the tests that
  # need no Hub (operator fixtures, fusion, compilation) and one small model of each
  # pipeline (tag :smoke).
  emlx:
    name: Tests / emlx
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # erlef/setup-beam does not support macOS. Homebrew installs the latest release.
      - name: Set up Elixir
        id: beam
        run: |
          brew install elixir
          echo "version=$(elixir -e 'IO.write(System.version() <> "-otp" <> System.otp_release())')" >> "$GITHUB_OUTPUT"
          mix local.hex --force
          mix local.rebar --force
      # The Library/Caches directories keep the MLX and XLA archives and the compiled NIFs.
      - name: Restore dependencies cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            deps
            _build
            ~/Library/Caches/libmlx
            ~/Library/Caches/xla
          key: ${{ runner.os }}-mix-${{ steps.beam.outputs.version }}-${{ hashFiles('**/mix.lock') }}
      - name: Restore model cache
        id: models
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/transmuter
          key: ${{ runner.os }}-transmuter-models-v2-
          restore-keys: ${{ runner.os }}-transmuter-models-v2-
      - name: Install dependencies
        run: mix deps.get
      - name: Run tests
        env:
          TRANSMUTER_TEST_BACKEND: emlx
          TRANSMUTER_TEST_DEVICE: gpu
        run: mix test --exclude large_model --exclude hub --include smoke
      - name: List the cached models
        id: model-files
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: *list-models
      - name: Save model cache
        if: steps.model-files.outputs.hash != '' && steps.models.outputs.cache-matched-key != format('{0}-transmuter-models-v2-{1}', runner.os, steps.model-files.outputs.hash)
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/transmuter
          key: ${{ runner.os }}-transmuter-models-v2-${{ steps.model-files.outputs.hash }}
