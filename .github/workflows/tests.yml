name: Run Tests

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # EXLA on the CPU is a real Linux deployment, so these jobs run all tests. The slowest
  # test modules have a :ci_partition tag, and each tagged partition runs in its own job.
  # Partition 1 runs all tests without the tag. The tests of one module run one at a time,
  # so a slow test goes in a module of its own. Two slow modules in one job take longer than
  # in two jobs, because each XLA computation already uses all CPUs of the runner, so each
  # slow module has its own partition. --only also includes the :large_model tests
  # of a tagged module, so a tagged module has none (Transmuter.CIPartitionTest checks
  # this). The slowest tests and modules in the log show how to keep the partitions balanced.
  # Each partition downloads only the models of its tests. A new model goes first in the
  # partition with the fewest models, and a partition keeps under about 5 GB of models. A test
  # that needs more than 1 GB of model files has the :large_model tag.
  exla:
    name: Tests / exla (${{ matrix.partition }}/6)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { partition: 1, select: "--exclude ci_partition" }
          - { partition: 2, select: "--only ci_partition:2" }
          - { partition: 3, select: "--only ci_partition:3" }
          - { partition: 4, select: "--only ci_partition:4" }
          - { partition: 5, select: "--only ci_partition:5" }
          - { partition: 6, select: "--only ci_partition:6" }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # mix test starts the emlx application in this job too, and EMLX on Linux needs
      # OpenBLAS. The Ubuntu mirror often stalls, so the packages come from the cache, and
      # apt-get downloads them only when the cache is empty. apt-get can block on the dpkg
      # lock without a timeout, so each call is bounded and the download is retried once. A
      # download that gets no data for 20 s fails. apt reads its mirrors from apt-mirrors.txt,
      # and the second attempt removes the Azure mirror from it, so apt uses archive.ubuntu.com.
      # Change v1 when the cached packages no longer install on the runner image.
      - name: Restore OpenBLAS packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/openblas-debs
          key: ${{ runner.os }}-openblas-debs-v1
      - name: Install OpenBLAS (for emlx)
        timeout-minutes: 6
        run: |
          mirrors=/etc/apt/apt-mirrors.txt
          cat "$mirrors" || true

          if ldconfig -p | grep -q libopenblas.so.0; then
            echo "libopenblas already present, nothing to install"
            exit 0
          fi

          debs="$HOME/openblas-debs"

          if ! ls "$debs"/*.deb > /dev/null 2>&1; then
            mkdir -p "$debs/partial"
            status=1

            for attempt in 1 2; do
              if [ "$attempt" -gt 1 ]; then
                sleep 10
                [ -f "$mirrors" ] && sudo sed -i '/azure\.archive\.ubuntu\.com/d' "$mirrors"
              fi

              status=0
              timeout 60 sudo apt-get update -o Acquire::http::Timeout=20 &&
                timeout 90 sudo apt-get install -y --no-install-recommends --download-only \
                  -o Acquire::http::Timeout=20 -o Dir::Cache::archives="$debs" libopenblas0 ||
                status=$?

              if [ "$status" -eq 0 ]; then
                break
              elif [ "$status" -eq 124 ]; then
                echo "::warning::apt attempt $attempt stalled and was killed"
              else
                echo "::warning::apt attempt $attempt failed with status $status"
              fi
            done

            if [ "$status" -ne 0 ]; then
              echo "::error::could not download libopenblas0. A stall is usually the Ubuntu mirror; the apt output above says which."
              exit 1
            fi

            sudo rm -rf "$debs/partial" "$debs/lock"
          fi

          timeout 60 sudo dpkg -i "$debs"/*.deb
      - name: Set up Elixir
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          otp-version: "29"
          elixir-version: "1.20"
      # ~/.cache/xla keeps the XLA archive and the compiled EXLA NIF.
      - name: Restore dependencies cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            deps
            _build
            ~/.cache/xla
          key: ${{ runner.os }}-mix-otp29-elixir1.20-${{ hashFiles('**/mix.lock') }}
      - name: Install dependencies
        run: mix deps.get
      # Elixir and OTP are pinned in these jobs only, so the version-dependent checks run here,
      # in the first partition.
      - name: Check formatting
        if: matrix.partition == 1
        run: mix format --check-formatted
      - name: Compile without warnings
        if: matrix.partition == 1
        env:
          MIX_ENV: test
        run: mix compile --force --warnings-as-errors
      - name: Run Credo
        if: matrix.partition == 1
        run: mix credo --strict
      # Tests tagged large_model are too large or too slow for a runner, for example models
      # with billions of parameters. They run locally. Two tests at a time take 30% less
      # time than one, with a peak of about 7 GB on a runner that has 16 GB.
      # The tests download their ONNX models from the Hugging Face Hub, and there is no model
      # cache. GitHub keeps 10 GB of caches for a repository, and the models of all partitions
      # are 8.1 GB compressed, so a model cache made GitHub evict the other caches. The Hub
      # gives 74 to 176 MB/s on a runner, so the 4.7 GB of the largest partition take about
      # 65 s, as long as a restore of the cache took.
      - name: Run tests
        env:
          TRANSMUTER_TEST_BACKEND: exla
        run: mix test --exclude large_model --max-cases 2 ${{ matrix.select }} --slowest 10 --slowest-modules 6

  # EMLX on the Metal GPU of an Apple silicon runner, the configuration that EMLX users have.
  # The full EMLX suite runs on Apple silicon before a push. Here, EMLX runs the tests that
  # need no Hub (operator fixtures, fusion, compilation) and one small model of each
  # pipeline (tag :smoke). These tests download 2.7 GB of models from the Hub, without a
  # model cache for the reason in the exla job.
  emlx:
    name: Tests / emlx
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # erlef/setup-beam does not support macOS. Homebrew installs the latest release.
      - name: Set up Elixir
        id: beam
        run: |
          brew install elixir
          echo "version=$(elixir -e 'IO.write(System.version() <> "-otp" <> System.otp_release())')" >> "$GITHUB_OUTPUT"
          mix local.hex --force
          mix local.rebar --force
      # The Library/Caches directories keep the MLX and XLA archives and the compiled NIFs.
      - name: Restore dependencies cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            deps
            _build
            ~/Library/Caches/libmlx
            ~/Library/Caches/xla
          key: ${{ runner.os }}-mix-${{ steps.beam.outputs.version }}-${{ hashFiles('**/mix.lock') }}
      - name: Install dependencies
        run: mix deps.get
      - name: Run tests
        env:
          TRANSMUTER_TEST_BACKEND: emlx
          TRANSMUTER_TEST_DEVICE: gpu
        run: mix test --exclude large_model --exclude hub --include smoke
