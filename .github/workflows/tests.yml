name: Run Tests

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    name: OTP ${{matrix.otp}} / Elixir ${{matrix.elixir}}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { elixir: "1.20", otp: "29" }
          - { elixir: "1.19", otp: "28" }
          - { elixir: "1.18", otp: "27" }

    steps:
      - uses: actions/checkout@v7
      # EMLX runs MLX on the CPU on Linux and needs OpenBLAS. apt-get can block on
      # the dpkg lock without a timeout, so each call is bounded and retried once.
      - name: Install OpenBLAS (for emlx)
        timeout-minutes: 6
        run: |
          if ldconfig -p | grep -q libopenblas.so.0; then
            echo "libopenblas already present, nothing to install"
            exit 0
          fi

          for attempt in 1 2; do
            if [ "$attempt" -gt 1 ]; then
              sleep 10
            fi

            status=0
            timeout 60 sudo apt-get update &&
              timeout 90 sudo apt-get install -y --no-install-recommends libopenblas0 ||
              status=$?

            if [ "$status" -eq 0 ]; then
              exit 0
            fi

            if [ "$status" -eq 124 ]; then
              echo "::warning::apt attempt $attempt stalled and was killed"
            else
              echo "::warning::apt attempt $attempt failed with status $status"
            fi
          done

          echo "::error::could not install libopenblas0. A stall is usually the Ubuntu mirror; the apt output above says which."
          exit 1
      - name: Set up Elixir
        uses: erlef/setup-beam@v1
        with:
          otp-version: ${{matrix.otp}}
          elixir-version: ${{matrix.elixir}}
      - name: Restore dependencies cache
        uses: actions/cache@v6
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-otp${{ matrix.otp }}-elixir${{ matrix.elixir }}-${{ hashFiles('**/mix.lock') }}
      # The tests download ONNX models from the Hugging Face Hub. Every job restores the
      # newest model cache. Only one job saves it, on main, and only when the set of cached
      # files changed, because a save uploads the whole cache. Change v2 to start a cache
      # without the models that the tests no longer use.
      - name: Restore model cache
        id: models
        uses: actions/cache/restore@v6
        with:
          path: ~/.cache/transmuter
          key: ${{ runner.os }}-transmuter-models-v2-
          restore-keys: ${{ runner.os }}-transmuter-models-v2-
      - name: Install dependencies
        run: mix deps.get
      - name: Check formatting
        run: mix format --check-formatted
      - name: Compile without warnings
        env:
          MIX_ENV: test
        run: mix compile --force --warnings-as-errors
      - name: Run Credo
        run: mix credo --strict
      - name: Run tests
        run: mix test
      - name: List the cached models
        id: model-files
        if: matrix.otp == '29' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          cd ~/.cache/transmuter
          hash=$(find . -type f ! -name '*.part' | sort | sha256sum | cut -c1-16)
          echo "hash=$hash" >> "$GITHUB_OUTPUT"
          echo "Model cache: $(du -sh . | cut -f1), file list hash $hash"
      - name: Save model cache
        if: steps.model-files.outputs.hash != '' && steps.models.outputs.cache-matched-key != format('{0}-transmuter-models-v2-{1}', runner.os, steps.model-files.outputs.hash)
        uses: actions/cache/save@v6
        with:
          path: ~/.cache/transmuter
          key: ${{ runner.os }}-transmuter-models-v2-${{ steps.model-files.outputs.hash }}
